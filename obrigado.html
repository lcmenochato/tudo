<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Pedido concluído — TikTok Shop</title>
<link rel="icon" href="/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
body{margin:0;font-family:'Inter',system-ui,sans-serif;background:#f8fafc;color:#1a1a2e;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.card{max-width:440px;background:#fff;border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.check{width:72px;height:72px;border-radius:50%;background:#dcfce7;color:#15803d;display:inline-flex;align-items:center;justify-content:center;font-size:38px;margin-bottom:14px}
h1{margin:6px 0 8px;font-size:24px;font-weight:800}
p{color:#4b5563;line-height:1.55;margin:0 0 8px}
</style>
<style id="lv-zoom-fix">input,select,textarea{font-size:16px !important;}@supports(-webkit-touch-callout:none){input,select,textarea{font-size:16px !important;}}</style></head>
<body>
<div class="card">
  <div class="check">✓</div>
  <h1>Tudo certo!</h1>
  <p>Seu pedido foi confirmado com sucesso e já está em processamento.</p>
  <p>Você receberá atualizações no e-mail cadastrado.</p>
</div>
<script src="/js/tiktok-pixel.js"></script><script src="/js/utm.js"></script><script src="/js/support-widget.js" defer></script></body>
</html>
